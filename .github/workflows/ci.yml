name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VoiSlate.slnx

      - name: Build
        run: dotnet build VoiSlate.slnx -c Debug --no-restore

      - name: Test
        run: dotnet test VoiSlate.slnx -c Debug --no-build
